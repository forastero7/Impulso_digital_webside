name: Publicar en GitHub Pages

# Solo manual: hoy GitHub Pages publica desde la rama ("Deploy from a branch").
# Ejecutarlo en cada push competía con esa publicación y el resultado dependía de cuál
# terminaba último. Si se cambia Settings → Pages → Source a "GitHub Actions", volver a
# añadir el disparador "push" y actualizar canonical/sitemap (la web quedaría en la raíz).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
